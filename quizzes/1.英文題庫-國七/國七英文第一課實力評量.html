
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>英文國中第一課</title>
<style>
body{font-family:"Microsoft JhengHei";font-size:22px;background:#f4f8fc;padding:20px;line-height:1.8}
.sec{background:#fff;border:1px solid #ccc;border-radius:10px;padding:15px;margin-bottom:18px}
button{font-size:18px;margin:4px}
input{font-size:20px;padding:4px}
.ok{color:green;font-weight:bold}.bad{color:red;font-weight:bold}

.passage{
    white-space: pre-wrap;
    line-height: 1.8;
}

.note{
    margin-top:15px;
}

.note textarea{
    width:100%;
    height:120px;
    font-size:18px;
    padding:8px;
    box-sizing:border-box;
}

/* Pop! Learning 粉紅主題｜與首頁風格一致 */
:root{
  --pop-pink:#d95791;
  --pop-pink-dark:#c94f82;
  --pop-pink-light:#fff0f6;
  --pop-pink-bg:#fff7fb;
  --pop-pink-border:#f5cfe0;
  --pop-text:#4b3f49;
  --pop-muted:#7d6f79;
  --pop-white:#ffffff;
  --pop-shadow:0 8px 24px rgba(217,87,145,.10);
}
body{
  background:linear-gradient(180deg,#fff7fb 0%,#fff 100%) !important;
  color:var(--pop-text) !important;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif !important;
}
h1,h2,h3{
  color:var(--pop-pink) !important;
  font-weight:900;
  letter-spacing:.02em;
}
h1{
  text-align:center;
  font-size:clamp(26px,4vw,36px);
}
button{
  border:0 !important;
  border-radius:14px !important;
  background:var(--pop-pink) !important;
  color:#fff !important;
  font-family:inherit !important;
  font-weight:800 !important;
  box-shadow:0 4px 10px rgba(217,87,145,.14);
  transition:transform .15s ease,box-shadow .15s ease;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 15px rgba(217,87,145,.18);
}
input,textarea{
  border:2px solid var(--pop-pink-border) !important;
  border-radius:12px !important;
  font-family:inherit !important;
  background:#fff !important;
}
input:focus,textarea:focus{
  outline:none !important;
  border-color:var(--pop-pink) !important;
  box-shadow:0 0 0 3px rgba(217,87,145,.10);
}

/* 常見題庫卡片 */
.card,.quiz,.screen,.sec,.q,.question{
  background:var(--pop-white) !important;
  border-color:var(--pop-pink-border) !important;
  border-radius:22px !important;
  box-shadow:var(--pop-shadow) !important;
}
.q,.question{
  border-width:2px !important;
}
.section-description,.subtitle{
  color:var(--pop-muted) !important;
}

/* 粉紅次要按鈕 */
.pink,.secondary,.speak{
  background:var(--pop-pink-light) !important;
  color:var(--pop-pink-dark) !important;
  border:2px solid var(--pop-pink-border) !important;
}
.yellow{
  background:#fff0f6 !important;
  color:var(--pop-pink-dark) !important;
  border:2px solid var(--pop-pink-border) !important;
}
.primary,.check{
  background:var(--pop-pink) !important;
  color:#fff !important;
}

/* 正確／錯誤仍保留辨識色，但柔和一些 */
.ok,.correct{
  color:#198754 !important;
}
.bad,.wrong{
  color:#d84f68 !important;
}
.feedback{
  border-radius:14px !important;
}

/* 手機版 */
@media(max-width:700px){
  body{padding:14px !important}
}

body{padding:24px !important}
#quiz{max-width:1000px;margin:0 auto}
.sec{padding:22px !important;margin-bottom:18px !important;border:2px solid #f5cfe0 !important}
.sec h2{margin-top:0}
.passage{background:#fff8fc;padding:18px;border-radius:16px;border:1px solid #f5cfe0}
.note textarea{border:2px solid #f5cfe0 !important}

</style>
</head>
<body>
<h1>英文國中第一課</h1>


<div id="quiz"></div>

<script>
const data=[
{sec:"一、文意字彙",type:"text",q:"Samantha is a w_____r. Her books are good.",a:"writer"},
{sec:"一、文意字彙",type:"text",q:"I'm in Class(班級) 702, and Anthony is, too. He is my c_____e.",a:"classmate"},
{sec:"一、文意字彙",type:"text",q:"A: Who's that b_____ul woman? B: She's my aunt, Jessie.",a:"beautiful"},
{sec:"一、文意字彙",type:"text",q:"A: Joseph and Minnie are h_____d and wife. They are happy together(在一起).",a:"husband"},
{sec:"一、文意字彙",type:"text",q:"A: Our teacher is 23. B: Wow! She's y_____g.",a:"young"},
{sec:"一、文意字彙",type:"text",q:"A: Are you a student? B: Yes, I'm in j_____r h_____h school.",a:"junior high"},
{sec:"二、縮寫式",type:"text",q:"we are",a:"we're"},
{sec:"二、縮寫式",type:"text",q:"I am not",a:"I'm not"},
{sec:"二、縮寫式",type:"text",q:"it is",a:"it's"},
{sec:"二、縮寫式",type:"text",q:"who is",a:"who's"},
{sec:"二、縮寫式",type:"text",q:"she is not",a:"she's not"},
{sec:"二、縮寫式",type:"text",q:"you are not",a:"you're not"},
{sec:"二、縮寫式",type:"text",q:"that is",a:"that's"},
{sec:"二、縮寫式",type:"text",q:"he is",a:"he's"},
{sec:"三、選擇題",type:"choice",q:"Vivi's dog is one ______",opts:["years old","year old","years","year"],a:1},
{sec:"三、選擇題",type:"choice",q:"They are Jasse, Kate, and Ted. ______ father is my good friend.",opts:["Their","Our","His","Your"],a:0},
{sec:"三、選擇題",type:"choice",q:"How old ______ your grandma and grandpa?",opts:["is","be","am","are"],a:3},
{sec:"三、選擇題",type:"choice",q:"A: ______ is Phoebe's job(職業)? B: She's a doctor.",opts:["It","How","What","Who"],a:2},
{sec:"三、選擇題",type:"choice",q:"A: ______ Anny? B: She's Nick's wife.",opts:["What","Who's","Who","What's"],a:1},
{sec:"三、選擇題",type:"choice",q:"A: ______ a writer? B:Yes, I am.",opts:["Are you","Is he","Who is","Am I"],a:0},
{sec:"三、選擇題",type:"choice",q:"A: Is it a new car? B: No. It's ______.",opts:["a car","old car","new","an old car"],a:3},
{sec:"三、選擇題",type:"choice",q:"A: Who is Patrick? B: He's ______ cousin.",opts:["we","you","our","they"],a:2},
{sec:"三、選擇題",type:"choice",q:"A: ______ is he? B: He is fifteen.",opts:["Who","How old","What","How"],a:1},
{sec:"三、選擇題",type:"choice",q:"A: ______ your ______name? B: Olivia.",opts:["What; doll's","What; doll","What's; doll","What's; doll's"],a:3},
{sec:"四、依提示作答",type:"text",q:"Yes, they are my uncle and aunt. → 造原問句",a:"Are they your uncle and aunt?"},
{sec:"四、依提示作答",type:"text",q:"She is <u>Meg's sister</u>. → 依劃線部分造原問句",a:"Who is she?"},
{sec:"四、依提示作答",type:"text",q:"Is Danny a handsome boy?. → 肯定詳答",a:"Yes, he's a handsome boy."},
{sec:"五、句子重組",type:"text",q:"This / isn't / Stella's / baby",a:"This isn't Stella's baby."},
{sec:"五、句子重組",type:"text",q:"old / son / , / is / too / twelve / Our / . / years",a:"Our son is twelve years old, too."},
{sec:"五、句子重組",type:"text",q:"teacher / their / elementary school / He / is / .",a:"He is their elementary school teacher."},
{
sec:"六、整句翻譯",
type:"text",
q:"我的女兒，Alicia，是一位歌手。",
a:"My daughter, Alicia, is a singer.",

exp:`
<b>文法提醒：</b><br>
Alicia 是補充說明「my daughter」是誰，所以前後都要加逗號。
`
},
{sec:"六、整句翻譯",type:"text",q:"Mia，很高興認識妳。",a:"Mia, nice to meet you."},
{sec:"六、整句翻譯",type:"text",q:"我們是四口之家。",a:"We are a family of four.",

exp:`
<b>易錯提醒：</b><br>
family 是可數名詞，前面要加 a。<br><br>

<b>文法提醒：</b><br>
a family of four 表示「四口之家」，of four 表示「共有四個人」。
`
},
{sec:"六、整句翻譯",type:"text",q:"這位警察二十六歲，而他的妻子二十二歲。(數字需拼出)",a:"This police officer is twenty-six years old, and his wife is twenty-two years old.",

exp:`
<b>文法提醒：</b><br>
and 連接兩個完整句子時，前面通常要加逗號。
`
},
{
  sec:"七、是非題",
  type:"passage",
  q:`閱讀下列短文，與內容相符的寫 T，不符的寫 F。

Alice is a young student. Her house is between Red Queen's house and White Queen's house. Red Queen's name is Helen. She is an old and kind woman. Her house is red. White Queen's name is Anne. She is nice and beautiful. She is twenty-nine years old. Her house is white, and her cat is white, too. Alice is the two queens' good friend.

house房子
between在…中間
queen皇后
kind仁慈的`

},

{sec:"七、是非題",type:"tf",q:"Helen is an old queen.",a:"T"},
{sec:"七、是非題",type:"tf",q:"Anne's Anne is 29 years old.",a:"T"},
{sec:"七、是非題",type:"tf",q:"Anne's house is red.",a:"F"},
{sec:"七、是非題",type:"tf",q:"Alice is Helen's good friend.",a:"T"},
{sec:"七、是非題",type:"tf",q:"Helen's house is next to Anne's house.",a:"F"},
{sec:"七、是非題",type:"tf",q:"Anne's cat is white.",a:"T"},
{
sec:"八、閱讀測驗",
type:"passage",
q:`閱讀下列短文，回答問題。

Bianca: Riddle me this. Teresa's daughter is my daughter's mother. What am I to Teresa?
Zelda: Hmm... are you a woman?
Bianca: Yes, and my daughter's grandma is Teresa.
Zelda: Um... this is hard.
Bianca: No, it isn't. Who is my daughter's mother?
Zelda: Your daughter's mother is... You! You are Teresa's _______.
Bianca: Yes!

Riddle me this.幫我解個謎。
hard困難的
blank空格`
},
{sec:"八、閱讀測驗",type:"choice",q:"Bianca is Teresa's ____.",opts:["sister","cousin","mother","daughter"],a:3},
];
const quiz=document.getElementById("quiz");
let last="";
let no=0;
data.forEach((x,i)=>{
 let d=document.createElement("div"); d.className="sec";
 let h="";
if(x.sec!==last){
    h+="<h2>"+x.sec+"</h2>";
    last=x.sec;
    no=0;
}

if(x.type!=="passage"){
    no++;
}
if(x.type==="passage"){

    h+=`
    <div class="passage">${x.q}</div>

    <div class="note">
        <b>📝 閱讀筆記：</b><br>
        <textarea
            placeholder="請記錄重要人物、單字、重點或推理過程..."
            style="width:100%;height:120px;font-size:18px;margin-top:8px;"
        ></textarea>
    </div>
    `;

}else{

    h+="<p><b>第"+no+"題：</b>"+x.q+"</p>";

}
if(x.type==="passage"){
    d.innerHTML=h;
    quiz.appendChild(d);
    return;
}
if(x.type==="text") h+=`<input id=t${i} size=40>`;
 if(x.type==="choice"){
   x.opts.forEach((o,j)=>h+=`<label><input type=radio name=r${i} value=${j}>${String.fromCharCode(65+j)}. ${o}</label><br>`);
 }
 if(x.type==="tf"){
   h+=`<label><input type=radio name=r${i} value=T>T</label>
   <label><input type=radio name=r${i} value=F>F</label>`;
 }
 h+=`<br><button data-i="${i}" class="check">對答案</button>
 <button id=s${i} style="display:none">顯示答案</button>
 <div id=r${i}></div><div id=a${i}></div>`;
 d.innerHTML=h; quiz.appendChild(d);
});
document.querySelectorAll(".check").forEach(b=>b.addEventListener("click",()=>{
 let i=b.dataset.i,q=data[i],ok=false;
 if(q.type==="text"){
   ok=document.getElementById("t"+i).value.trim().toLowerCase()===q.a.toLowerCase();
 }else{
   let s=document.querySelector(`input[name=r${i}]:checked`);
   if(!s){alert("請先作答");return;}
   ok=q.type==="choice"?Number(s.value)===q.a:s.value===q.a;
 }
 document.getElementById("r"+i).innerHTML=ok?'<span class=ok>✓答對</span>':'<span class=bad>✗答錯</span>';
 let sb=document.getElementById("s"+i);
 sb.style.display=ok?"none":"inline";
sb.onclick=()=>{

    let ans=q.type==="text"
        ?q.a
        :(q.type==="tf"
            ?q.a
            :String.fromCharCode(65+q.a)+". "+q.opts[q.a]);

    document.getElementById("a"+i).innerHTML=
        "<b>答案：</b>"+ans+
        (q.exp ? "<hr>"+q.exp : "");

};
}));
</script>

<script id="enterAnswerHandler">
// 文字答案輸入框按 Enter，等同按「對答案」
document.querySelectorAll('input[type="text"], input:not([type])').forEach(input=>{
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      const box = this.closest('.sec');
      const btn = box ? box.querySelector('button.check') : null;
      if(btn) btn.click();
    }
  });
});
</script>

</body></html>
