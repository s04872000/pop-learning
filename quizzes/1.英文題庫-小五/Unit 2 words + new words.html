<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:linear-gradient(135deg,#fff5fa,#ffeaf4);color:#40364a}

.diagnostic-table{width:100%;border-collapse:collapse;margin-top:15px}.diagnostic-table th,.diagnostic-table td{border:1px solid #edd9e3;padding:10px;text-align:left}.diagnostic-table th{background:#fff3f8}
.diagnostic-table input{width:100%;max-width:280px;padding:11px;border:2px solid #ddd;border-radius:10px;font-size:19px}
.ok{color:#158c4d;font-weight:800}.bad{color:#d33;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.group-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.group-card{padding:18px;border:2px solid #f3d6e3;border-radius:18px;background:#fff8fc}.word-list{color:#766b7d;line-height:1.8}
.flashcard{min-height:320px;background:linear-gradient(145deg,#fff9fc,#fff5fa);border:3px solid #f2cddd;border-radius:25px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer;user-select:none}
.flash-word{font-size:42px;font-weight:900;color:#d95791}.ipa{font-family:"Times New Roman","Noto Sans",sans-serif;font-size:23px;color:#7b6872;margin:7px 0 14px}.flash-zh{font-size:34px;font-weight:900;color:#b94d70}.small{font-size:14px;color:#806f78}
.bigword{font-size:48px;font-weight:900;margin:22px 0 8px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;max-width:760px;margin:20px auto}
.option{border:3px solid #f0d7e4;background:#fff;border-radius:18px;padding:18px;font-size:22px;font-weight:800}.option.correct{background:#ffe9f3;border-color:#d95791}.option.wrong{background:#ffe3e3;border-color:#ef6d6d}
.feedback{min-height:28px;font-size:20px;font-weight:800;margin:10px}.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.game-card{border:0;background:linear-gradient(135deg,#fff,#fff2f8);border-radius:22px;padding:20px;box-shadow:0 5px 15px #0001;text-align:left}.game-card .emoji{font-size:42px}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:20px auto}.match-card{height:100px;border:0;border-radius:18px;background:#f8e9f2;font-size:19px;font-weight:800}.match-card.flipped,.match-card.matched{background:#fff;border:3px solid #d95791}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:700px;margin:20px auto}.hole{height:120px;border:0;border-radius:50%;background:#f8e5ef;font-size:24px;font-weight:900}.hole.active{background:#ffe2f0;border:5px solid #d95791}

.lesson-section{margin:18px 0;padding:18px;border:2px solid #efdde5;border-radius:20px;background:#fffafd}.lesson-section h3{color:#d95791}.lesson-section .option:disabled{cursor:default;opacity:.9}.lesson-speak{margin:6px 0 12px}\n.phonics-ipa{font-family:"Times New Roman",serif;font-size:20px;color:#7b6872;font-weight:700;margin-left:4px}.ipa{font-family:"Times New Roman",serif;font-size:20px;color:#7b6872;font-weight:700}

</head><body><div class="app">
<header><h1>🌸 Unit 2 健康英文學習樂園</h1><p class="subtitle">先看小文章 → 5個單字閃卡 → 分組測驗 → 全單字測驗 → 圖片情境句子測驗 → 小遊戲。</p>
<div class="stats"><div class="stat">📚 全部：<span id="totalCount">20</span></div><div class="stat">✅ 已排除：<span id="masteredCount">0</span></div><div class="stat">📕 待學習：<span id="remainingCount">20</span></div><div class="stat">⭐ 遊戲分數：<span id="score">0</span></div></div></header>
<div class="nav">
<button class="active" onclick="showArticle(this)">📖 小文章</button>
<button onclick="showGroups(this)">🧠 5個閃卡</button>
<button onclick="showDiagnostic(this)">📝 全單字測驗</button>
<button onclick="showSentenceQuiz(this)">🖼️ 圖片句子測驗</button>
<button onclick="showLesson(this)">📚 教材</button><button onclick="showGames(this)">🎮 遊戲樂園</button>
</div>
<div id="screen" class="screen"></div></div>
<script>
const ALL=[{"en": "cold", "zh": "感冒", "pos": "noun", "ipa": "/koʊld/"}, {"en": "cough", "zh": "咳嗽", "pos": "noun", "ipa": "/kɔːf/"}, {"en": "fever", "zh": "發燒", "pos": "noun", "ipa": "/ˈfiːvər/"}, {"en": "headache", "zh": "頭痛", "pos": "noun", "ipa": "/ˈhɛdeɪk/"}, {"en": "stomachache", "zh": "胃痛", "pos": "noun", "ipa": "/ˈstʌməkˌeɪk/"}, {"en": "toothache", "zh": "牙痛", "pos": "noun", "ipa": "/ˈtuːθeɪk/"}, {"en": "runny nose", "zh": "流鼻水", "pos": "noun", "ipa": "/ˌrʌni ˈnoʊz/"}, {"en": "sore throat", "zh": "喉嚨痛", "pos": "noun", "ipa": "/sɔːr θroʊt/"}, {"en": "sick", "zh": "生病的", "pos": "adj", "ipa": "/sɪk/"}, {"en": "doctor", "zh": "醫生", "pos": "noun", "ipa": "/ˈdɑːktər/"}, {"en": "nurse", "zh": "護士", "pos": "noun", "ipa": "/nɜːrs/"}, {"en": "hospital", "zh": "醫院", "pos": "noun", "ipa": "/ˈhɑːspɪtəl/"}, {"en": "Take care.", "zh": "保重", "pos": "phrase", "ipa": "/teɪk kɛr/"}, {"en": "bang", "zh": "砰砰猛擊", "pos": "noun/verb", "ipa": "/bæŋ/"}, {"en": "gong", "zh": "鑼", "pos": "noun", "ipa": "/ɡɔːŋ/"}, {"en": "jug", "zh": "壺；罐", "pos": "noun", "ipa": "/dʒʌɡ/"}, {"en": "hug", "zh": "擁抱", "pos": "noun/verb", "ipa": "/hʌɡ/"}, {"en": "tap", "zh": "輕敲；跳踢踏舞", "pos": "verb/noun", "ipa": "/tæp/"}, {"en": "rap", "zh": "饒舌；敲擊", "pos": "noun/verb", "ipa": "/ræp/"}, {"en": "din", "zh": "嘈雜聲", "pos": "noun", "ipa": "/dɪn/"}];
const GROUPS=[];
let mastered=JSON.parse(localStorage.getItem("unit2Mastered")||"[]"), remaining=[], score=Number(localStorage.getItem("unit2Score")||0);
let flashItems=[],flashIndex=0,flashFlip=false,groupPool=[],groupIndex=0,groupScore=0,groupWrong=[];
let whackEnd=0,whackActive=-1,whackInterval=null,matchState={},runWord=null,runOpts=null,scrambleWord=null,listenWord=null,listenOpts=null;
const screen=document.getElementById("screen");
document.getElementById("score").textContent=score;
const sync=()=>{remaining=ALL.filter(w=>!mastered.includes(w.en));document.getElementById("masteredCount").textContent=mastered.length;document.getElementById("remainingCount").textContent=remaining.length};
const save=()=>{localStorage.setItem("unit2Mastered",JSON.stringify(mastered));sync()};
const addScore=n=>{score+=n;localStorage.setItem("unit2Score",score);document.getElementById("score").textContent=score};
const nav=btn=>{document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active")};
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const norm=s=>s.trim().toLowerCase().replace(/[.…。！？]/g,"").replace(/\s+/g," ");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}


function speakLessonText(text){speak(text)}
function lessonSpeak(btn){
  speak(btn.getAttribute('data-text') || '');
}

function showLesson(btn){nav(btn);screen.innerHTML=`<h2>📚 健康英文＋自然拼讀教材</h2><div class="note">先讀懂句子，再看重點文法與字詞。紅字是需要特別記住的內容。</div><div class="lesson-section"><h3>📖 句子重點</h3><div class="sentence-box"><div class="sentence-en memorize-answer">The ball hit me and I fell down.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="The ball hit me and I fell down.">🔊 聽發音</button><div class="sentence-zh">球打到我，我跌倒了。</div><p><b>fall</b> = 跌倒、掉落 → <b>fall → fell</b></p></div><div class="sentence-box"><div class="sentence-en memorize-answer">That is not what happened.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="That is not what happened.">🔊 聽發音</button><div class="sentence-zh">事情不是那樣發生的。</div><p><b>what happened</b> = 發生的事情、事情的實際經過；<b>what + 動詞</b> 可表示「……的事情／……的內容」。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">What’s wrong with you?</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="What’s wrong with you?">🔊 聽發音</button><div class="sentence-zh">你怎麼了？／你哪裡不舒服？</div><p><b>wrong</b> = 有問題的、不對勁的；<b>with you</b> = 在你身上、你的狀況。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">I’ll have her stay home from school.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="I’ll have her stay home from school.">🔊 聽發音</button><div class="sentence-zh">我會讓她留在家裡不上學。</div><p><b>have + 人 + 動詞原形</b> = 叫／讓某人做某事；<b>from</b> = 從……、離開……、與……分開。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">That would be a good idea.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="That would be a good idea.">🔊 聽發音</button><div class="sentence-zh">那會是個好主意。</div><p><b>would be</b> = 會是；would 可讓語氣比較委婉、客氣。<br><b>大部分助動詞後面都要接原形動詞。</b></p></div><div class="sentence-box"><div class="sentence-en memorize-answer">OK, be sure to take your medicine three times a day after meals.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="OK, be sure to take your medicine three times a day after meals.">🔊 聽發音</button><div class="sentence-zh">好的，記得飯後一天吃三次藥。</div><p><b>be sure to + 原形動詞</b> = 務必／一定要……</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">Kip gets sick.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="Kip gets sick.">🔊 聽發音</button><div class="sentence-zh">Kip 生病了。</div><p><b>gets</b> = 變得、變成；get sick = 生病。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">I can get your cup. I can fill it up.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="I can get your cup. I can fill it up.">🔊 聽發音</button><div class="sentence-zh">我可以拿你的杯子。我可以把它裝滿。</div><p><b>get</b> = 拿、取得；<b>fill</b> = 裝滿、填滿；<b>fill up</b> = 裝滿。<br><b>fill</b> 是動詞「裝滿」；<b>full</b> 是形容詞「滿的」。<br><b>up</b> 有時有完成、徹底的語感：eat up、drink up、use up、clean up。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">San went tap, tap. San did a rap.</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="San went tap, tap. San did a rap.">🔊 聽發音</button><div class="sentence-zh">San 輕敲、輕拍；San 做了一段 rap／敲擊。</div><p><b>went</b> = go 的過去式；<b>tap</b> = 輕敲、輕拍；<b>did</b> = do 的過去式；<b>rap</b> = 饒舌／敲擊。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">Knock, knock, knock. “This is the doc!”</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="Knock, knock, knock. “This is the doc!”">🔊 聽發音</button><div class="sentence-zh">叩、叩、叩。「我是醫生！」</div><p><b>doc</b> = doctor 的口語縮寫。</p></div><div class="sentence-box"><div class="sentence-en memorize-answer">His pals did the trick. Kip is not sick!</div><button type="button" class="yellow lesson-speak" onclick="lessonSpeak(this)" data-text="His pals did the trick. Kip is not sick!">🔊 聽發音</button><div class="sentence-zh">他的朋友們成功了。Kip 沒有生病！</div><p><b>pals</b> = 朋友們；<b>do the trick</b> = 奏效、成功、達到目的。</p></div></div><div class="lesson-section"><h3>🔤 自然拼讀／韻腳</h3><div class="group-grid">
<div class="group-card"><h3>-ug</h3><div class="word-list">
<b>jug</b> 壺；罐　<span class="ipa">/dʒʌɡ/</span> <button type="button" class="yellow" onclick="speakLessonText('jug')">🔊</button><br>
<b>hug</b> 擁抱　<span class="ipa">/hʌɡ/</span> <button type="button" class="yellow" onclick="speakLessonText('hug')">🔊</button></div></div>
<div class="group-card"><h3>-ap</h3><div class="word-list">
<b>tap</b> 輕敲；跳踢踏舞　<span class="ipa">/tæp/</span> <button type="button" class="yellow" onclick="speakLessonText('tap')">🔊</button><br>
<b>rap</b> 饒舌；敲擊　<span class="ipa">/ræp/</span> <button type="button" class="yellow" onclick="speakLessonText('rap')">🔊</button></div></div>
<div class="group-card"><h3>其他聲音／動作字</h3><div class="word-list">
<b>bang</b> 砰砰猛擊 <button type="button" class="yellow" onclick="speakLessonText('bang')">🔊</button><br>
<b>gong</b> 鑼 <button type="button" class="yellow" onclick="speakLessonText('gong')">🔊</button><br>
<b>din</b> 嘈雜聲 <button type="button" class="yellow" onclick="speakLessonText('din')">🔊</button></div></div>
</div></div><div class="lesson-section"><h3>🧩 with 的常見用法</h3><div class="group-grid">
<div class="group-card"><b>和……一起</b><p>I went <b>with</b> my mom. <button type="button" class="yellow" onclick="speakLessonText('I went with my mom.')">🔊</button></p></div>
<div class="group-card"><b>有、帶有</b><p>a girl <b>with</b> long hair <button type="button" class="yellow" onclick="speakLessonText('a girl with long hair')">🔊</button></p></div>

const lessonQuestions=[{q:'fall 的過去式是？',o:['fell','felt','falled','fall'],a:0},{q:'have + 人 + 動詞原形的意思是？',o:['正在做','叫／讓某人做某事','已經做完','可能會做'],a:1},{q:'fill 和 full 哪一個是形容詞「滿的」？',o:['fill','full'],a:1},{q:'What’s wrong with you? 最自然的意思是？',o:['你怎麼了？','你和誰一起？','你從哪裡來？','你在做什麼？'],a:0},{q:'I can fill it up. 中的 it 指什麼？',o:['your cup','medicine','school','doctor'],a:0},{q:'doc 是哪個字的口語縮寫？',o:['doctor','dodgeball','dinner','dollar'],a:0},{q:'do the trick 是什麼意思？',o:['做把戲','奏效／成功','快速離開','大聲說話'],a:1},{q:'哪一組是押韻相近的 -ug 單字？',o:['jug / hug','tap / din','bang / hospital','doctor / cough'],a:0}];
let lessonWrongQuestions = [];

function lessonCheck(btn,ok){
  const card=btn.parentElement;
  const qText = card.parentElement.querySelector('b') ? card.parentElement.querySelector('b').textContent : '';
  const options=[...card.querySelectorAll('.option')].map(b=>b.textContent);
  const optionIndex=[...card.querySelectorAll('.option')].indexOf(btn);
  const correctIndex = ok ? optionIndex : getCorrectLessonIndex(qText);
  const answer = correctIndex >= 0 ? options[correctIndex] : '';
  if(!ok && !lessonWrongQuestions.some(x=>x.q===qText)){
    lessonWrongQuestions.push({q:qText, options:options, answer:answer});
  }
  card.querySelectorAll('.option').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok && correctIndex >= 0){
    card.querySelectorAll('.option')[correctIndex].classList.add('correct');
  }
  const fb=document.createElement('div');
  fb.className='feedback '+(ok?'ok':'bad');
  fb.textContent=ok?'🎉 答對！':'❌ 答錯，這題會加入重新測驗';
  card.parentElement.appendChild(fb);
  updateLessonRetryButton();
}

function getCorrectLessonIndex(qText){
  const answers={
    '1. fall 的過去式是？':'fell',
    '2. 「have + 人 + 動詞原形」的意思是？':'叫／讓某人做某事',
    '3. fill 和 full 哪一個是形容詞「滿的」？':'full',
    '4. What’s wrong with you? 最自然的意思是？':'你怎麼了？',
    '5. 「I can fill it up.」中的 it 指什麼？':'your cup',
    '6. doc 是哪個字的口語縮寫？':'doctor',
    '7. do the trick 是什麼意思？':'奏效／成功',
    '8. 哪一組是押韻相近的 -ug 單字？':'jug / hug'
  };
  const ans=answers[qText];
  if(!ans) return -1;
  const card=[...document.querySelectorAll('.question-card')].find(c=>c.querySelector('b')?.textContent===qText);
  if(!card) return -1;
  return [...card.querySelectorAll('.option')].findIndex(b=>b.textContent===ans);
}

function updateLessonRetryButton(){
  let box=document.getElementById('lessonRetryBox');
  if(!box){
    box=document.createElement('div');
    box.id='lessonRetryBox';
    box.className='center';
    screen.querySelector('.lesson-section:last-child').appendChild(box);
  }
  box.innerHTML=lessonWrongQuestions.length
    ? '<button class="primary" onclick="retryLessonWrong()">🔄 重新測驗錯題（'+lessonWrongQuestions.length+'題）</button>'
    : '<div class="note">🎉 目前沒有錯題。</div>';
}

function retryLessonWrong(){
  if(!lessonWrongQuestions.length){
    return;
  }
  const wrongSet=lessonWrongQuestions.slice();
  lessonWrongQuestions=[];
  let html='<h2>🔄 重新測驗錯題</h2><div class="note">這次只重新測驗上一輪答錯的題目。</div>';
  wrongSet.forEach((x,idx)=>{
    window.retryCurrentAnswer=x.answer;
    html+='<div class="question-card"><b>'+x.q+'</b><div class="options">'
      x.options.map(o=>'<button class="option" onclick="retryLessonAnswer(this,'+(o===x.answer?'true':'false')+')">'+o+'</button>').join('')+
      '</div><div class="feedback"></div></div>';
  });
  html+='<div class="center"><button class="pink" onclick="showLesson()">📚 回教材</button></div>';
  screen.innerHTML=html;
}

function retryLessonAnswer(btn,ok){
  const card=btn.parentElement;
  const fb=card.querySelector('.feedback');
  card.querySelectorAll('.option').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  fb.className='feedback '+(ok?'ok':'bad');
  fb.textContent=ok?'🎉 答對！':'❌ 答錯，再加入錯題';
  if(!ok){
    const qText=card.querySelector('b').textContent;
    const options=[...card.querySelectorAll('.option')].map(b=>b.textContent);
    const answer = window.retryCurrentAnswer || '';
    lessonWrongQuestions.push({q:qText,options:options,answer:answer});
  }
  let bottom=document.getElementById('lessonRetryBox2');
  if(!bottom){
    bottom=document.createElement('div');
    bottom.id='lessonRetryBox2';
    bottom.className='center';
    card.parentElement.appendChild(bottom);
  }
  const btnRetry=document.createElement('button');
  btnRetry.className='primary';
  btnRetry.textContent='🔄 再練錯題（'+lessonWrongQuestions.length+'題）';
  btnRetry.onclick=retryLessonWrong;
  bottom.innerHTML='';
  if(lessonWrongQuestions.length) bottom.appendChild(btnRetry);
}

function answerSentence(i){
  const x=window.sentenceCurrent,btns=document.querySelectorAll('.option'),fb=document.getElementById('sentenceFeedback');
  if(x.opts[i]===x.a){
    btns[i].classList.add('correct'); sentenceScore++; fb.textContent='🎉 答對！';
  }else{
    btns[i].classList.add('wrong');
    const ci=x.opts.indexOf(x.a);
    if(ci>=0)btns[ci].classList.add('correct');
    sentenceWrong.push(x);
    fb.textContent='❌ 正確答案：'+x.a;
  }
  setTimeout(()=>{sentenceIndex++;renderSentenceQuiz()},850);
}

function showDiagnostic(btn){nav(btn);sync();const rows=ALL.map((w,i)=>`<tr><td>${i+1}</td><td><b>${w.zh}</b></td><td><button type="button" class="yellow" onclick="speak(\'${w.en.replace(/'/g,"\\'")}\')">🔊</button> <input id="diag-${i}" placeholder="輸入英文"></td><td id="diag-msg-${i}"></td></tr>`).join("");

function checkOne(i){const input=document.getElementById("diag-"+i),msg=document.getElementById("diag-msg-"+i);if(!input)return false;const ok=norm(input.value)===norm(ALL[i].en)&&input.value.trim()!=="";msg.innerHTML=ok

}
function retryGroupWrong(){startGroupQuiz(window.lastWrongGroup)}
function showGames(btn){nav(btn);screen.innerHTML=`<h2>🎮 單字遊戲樂園</h2><p>以目前待學習的健康單字為主；已排除的單字不優先出現。</p><div class="game-grid"><button class="game-card" onclick="gameQuick()"><div class="emoji">🎯</div><h3>快問快答</h3><p>看英文選中文。</p></button><button class="game-card" onclick="gameWhack()"><div class="emoji">🐹</div><h3>英文打地鼠</h3><p>找出正確英文。</p></button><button class="game-card" onclick="gameMatch()"><div class="emoji">🃏</div><h3>記憶翻牌</h3><p>英文和中文配對。</p></button><button class="game-card" onclick="gameRun()"><div class="emoji">🏃</div><h3>單字跑酷</h3><p>選對答案跳過障礙。</p></button><button class="game-card" onclick="gameScramble()"><div class="emoji">🔤</div><h3>拼字重組</h3><p>重新排列字母。</p></button><button class="game-card" onclick="gameListen()"><div class="emoji">🔊</div><h3>聽音選字</h3><p>聽發音選英文。</p></button><button class="game-card" onclick="gameSymptom()"><div class="emoji">🩺</div><h3>症狀配對</h3><p>看中文症狀選出英文單字。</p></button></div>`}
function gameWords(){const r=ALL.filter(w=>!mastered.includes(w.en));return r.length?r:ALL}
function opts(correct){return shuffle([correct,...shuffle(gameWords().filter(w=>w.en!==correct.en)).slice(0,3)])}
let quickSet=[],quickI=0;
function gameQuick(){quickSet=shuffle(gameWords()).slice(0,10);quickI=0;renderQuick()}
function renderQuick(){if(quickI>=quickSet.length){screen.innerHTML=`<div class="center"><h2>🎉 快問快答完成！</h2><button class="primary" onclick="gameQuick()">再玩一次</button></div>`;return}const w=quickSet[quickI],o=opts(w);screen.innerHTML=`<h2>🎯 快問快答</h2><div>第 ${quickI+1} / ${quickSet.length} 題</div><div class="center"><div class="bigword">${esc(w.en)}</div><p>中文是什麼？</p><div class="options">${o.map((x,i)=>`<button class="option" onclick="answerQuick(${i})">${esc(x.zh)}</button>`).join("")}</div><div id="qfb" class="feedback"></div></div>`;window.qopts=o;window.qword=w}
function answerQuick(i){const bs=document.querySelectorAll(".option"),x=qopts[i];if(x.en===qword.en){bs[i].classList.add("correct");addScore(10);document.getElementById("qfb").textContent="🎉 答對！"}else{bs[i].classList.add("wrong");bs[qopts.findIndex(x=>x.en===qword.en)].classList.add("correct");document.getElementById("qfb").textContent=`❌ ${qword.zh}`}setTimeout(()=>{quickI++;renderQuick()},650)}
function stopWhack(){if(whackInterval)clearInterval(whackInterval);whackInterval=null}
function gameWhack(){stopWhack();whackEnd=Date.now()+30000;screen.innerHTML=`<h2>🐹 英文打地鼠</h2><div class="center"><div id="wt" class="timer">30</div><p id="wq"></p></div><div class="holes">${[0,1,2,3,4,5].map(i=>`<button id="wh${i}" class="hole" onclick="hitWhack(${i})"></button>`).join("")}</div><div id="wf" class="feedback center"></div>`;nextWhack();whackInterval=setInterval(()=>{const t=Math.max(0,Math.ceil((whackEnd-Date.now())/1000));const el=document.getElementById("wt");if(el)el.textContent=t;if(t<=0){stopWhack();screen.innerHTML=`<div class="center"><h2>⏰ 時間到！</h2><button class="primary" onclick="gameWhack()">再玩一次</button></div>`}},250)}
function nextWhack(){if(Date.now()>=whackEnd)return;const w=shuffle(gameWords())[0],o=opts(w);whackActive=Math.floor(Math.random()*6);window.whackWord=w;document.getElementById("wq").innerHTML=`請找到：<b>${esc(w.en)}</b>`;for(let i=0;i<6;i++){const h=document.getElementById("wh"+i);h.classList.toggle("active",i===whackActive);h.textContent=i===whackActive?w.en:shuffle(o)[0].en}}
function hitWhack(i){if(i!==whackActive)return;const h=document.getElementById("wh"+i);if(h.textContent===whackWord.en){addScore(15);document.getElementById("wf").textContent="💥 打中了！";nextWhack()}}
function gameMatch(){const c=shuffle(gameWords()).slice(0,6);matchState={cards:shuffle(c.flatMap((w,i)=>[{id:i,text:w.en,type:"en"},{id:i,text:w.zh,type:"zh"}])),first:null,second:null,matched:0};matchLock=false;screen.innerHTML=`<h2>🃏 記憶翻牌</h2><div class="center">找出英文＋中文的一對！</div><div class="match-grid">${matchState.cards.map((x,i)=>`<button class="match-card" id="mc${i}" onclick="flipMatch(${i})">❓</button>`).join("")}</div>`}
function flipMatch(i){if(matchLock)return;const e=document.getElementById("mc"+i);if(e.classList.contains("matched")||e.classList.contains("flipped"))return;e.classList.add("flipped");e.textContent=matchState.cards[i].text;if(matchState.first===null){matchState.first=i;return}matchState.second=i;matchLock=true;setTimeout(()=>{const a=matchState.cards[matchState.first],b=matchState.cards[matchState.second];if(a.id===b.id&&a.type!==b.type){document.getElementById("mc"+matchState.first).classList.add("matched");document.getElementById("mc"+matchState.second).classList.add("matched");matchState.matched++;addScore(25);if(matchState.matched===6)screen.innerHTML=`<div class="center"><h2>🎉 全部配對成功！</h2><button class="primary" onclick="gameMatch()">再玩一次</button></div>`}else{document.getElementById("mc"+matchState.first).classList.remove("flipped");document.getElementById("mc"+matchState.second).classList.remove("flipped");document.getElementById("mc"+matchState.first).textContent="❓";document.getElementById("mc"+matchState.second).textContent="❓"}matchState.first=null;matchState.second=null;matchLock=false},650)}
function gameRun(){nextRun()}
function nextRun(){runWord=shuffle(gameWords())[0];runOpts=opts(runWord);screen.innerHTML=`<h2>🏃 單字跑酷</h2><div class="center"><div class="bigword">${esc(runWord.en)}</div></div><div class="runway"><div id="runner" class="runner">🏃</div><div class="obstacle">🪨</div></div><div class="actions" style="justify-content:center">${runOpts.map((x,i)=>`<button class="pink" onclick="answerRun(${i})">${esc(x.zh)}</button>`).join("")}</div><div id="rf" class="feedback center"></div>`}
function answerRun(i){const f=document.getElementById("rf"),r=document.getElementById("runner");if(runOpts[i].en===runWord.en){r.style.left="78%";addScore(20);f.textContent="✨ 跳過去了！";setTimeout(nextRun,700)}else{f.textContent="❌ "+runWord.zh;setTimeout(nextRun,900)}}
function gameScramble(){scrambleWord=shuffle(gameWords())[0];const letters=shuffle(scrambleWord.en.replace(/[^a-zA-Z]/g,"").toLowerCase().split(""));window.scrambleAnswer="";screen.innerHTML=`<h2>🔤 拼字重組</h2><div class="center"><div class="meaning">${esc(scrambleWord.zh)}</div><p>把字母拼成英文</p><div id="chosen" class="bigword" style="min-height:60px"></div><div class="scramble">${letters.map((l,i)=>`<button id="let${i}" class="letter" onclick="pickLetter(${i})">${l}</button>`).join("")}</div><button class="primary" onclick="checkScramble()">確認</button><button class="secondary" onclick="gameScramble()">換一題</button><div id="sf" class="feedback"></div></div>`;window.scrambleLetters=letters}
function pickLetter(i){const b=document.getElementById("let"+i);if(!b||b.disabled)return;b.disabled=true;window.scrambleAnswer+=b.textContent;document.getElementById("chosen").textContent=window.scrambleAnswer}
function checkScramble(){const f=document.getElementById("sf"),target=scrambleWord.en.replace(/[^a-zA-Z]/g,"").toLowerCase();if(window.scrambleAnswer===target){addScore(30);f.textContent="🎉 答對！";setTimeout(gameScramble,700)}else f.innerHTML=`❌ 答案：<b>${esc(scrambleWord.en)}</b>`}

function gameSymptom(){
  const w=shuffle(gameWords())[0];
  const o=opts(w);
  screen.innerHTML='<h2>🩺 症狀配對</h2><div class="center"><div class="meaning">'+esc(w.zh)+'</div><p>哪一個英文最符合？</p><div class="options">'+o.map((x,i)=>'<button class="option" onclick="symptomAnswer(this,'+i+')">'+esc(x.en)+'</button>').join('')+'</div><div id="symptomFeedback" class="feedback"></div></div>';
  window.symptomWord=w; window.symptomOpts=o;
}
function symptomAnswer(btn,i){
  const f=document.getElementById("symptomFeedback");
  if(symptomOpts[i].en===symptomWord.en){
    btn.classList.add("correct"); addScore(20); f.textContent="🎉 答對！";
  }else{
    btn.classList.add("wrong");
    f.textContent="❌ 正確答案："+symptomWord.en;
  }
  setTimeout(gameSymptom,800);
}
function gameListen(){listenWord=shuffle(gameWords())[0];listenOpts=opts(listenWord);screen.innerHTML=`<h2>🔊 聽音選字</h2><div class="center"><button class="yellow" onclick="speak('${listenWord.en.replace(/'/g,"\\'")}')">🔊 播放發音</button><p>聽完後選英文：</p><div class="options">${listenOpts.map((x,i)=>`<button class="option" onclick="listenAnswer(this,${i})">${esc(x.en)}</button>`).join("")}</div><div id="lf" class="feedback"></div></div>`}
function listenAnswer(btn,i){const f=document.getElementById("lf");if(listenOpts[i].en===listenWord.en){btn.classList.add("correct");addScore(20);f.textContent="🎉 答對！"}else{btn.classList.add("wrong");f.textContent=`❌ 正確答案：${listenWord.en}`}setTimeout(gameListen,800)}
sync();showArticle();
</script></body></html>
