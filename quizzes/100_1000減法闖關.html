<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100、1000減法闖關</title>
<style>
body{font-family:Arial;background:#dff4ff;margin:0}
.card{max-width:700px;margin:40px auto;background:#fff;padding:25px;border-radius:15px;text-align:center;box-shadow:0 0 10px #999}
#info{display:flex;justify-content:space-between;font-size:24px;margin-bottom:20px}
#q{font-size:54px}
#ans{font-size:36px;width:220px;text-align:center}
#msg{font-size:32px;font-weight:bold;height:40px}
</style>
</head>
<body>
<div class="card">
<h1>🎯 100、1000減法闖關</h1>
<div id="info">
<span id="stage">第1/20題</span>
<span id="score">⭐0</span>
<span id="life">❤️❤️❤️</span>
</div>
<h2 id="q"></h2>
<input id="ans" type="number" autofocus>
<p id="msg"></p>
<p>按 Enter 作答</p>
</div>
<script>
let score=0,life=3,no=1,q={};
const Q=document.getElementById('q'),A=document.getElementById('ans'),
M=document.getElementById('msg'),S=document.getElementById('score'),
L=document.getElementById('life'),ST=document.getElementById('stage');

function update(){
S.textContent='⭐'+score;
L.textContent='❤️'.repeat(life);
ST.textContent='第'+no+'/20題';
}
function newQ(){
if(no>20){
document.body.innerHTML='<h1 style="text-align:center;margin-top:80px">🏆 闖關完成！<br>得分：'+score+'/20</h1>';
return;
}
let b;
if(Math.random()<0.5){b=Math.floor(Math.random()*90)+10;q={t:'100 − '+b+' = ?',a:100-b};}
else{b=Math.floor(Math.random()*900)+100;q={t:'1000 − '+b+' = ?',a:1000-b};}
Q.textContent=q.t;A.value='';M.textContent='';update();A.focus();
}
function check(){
if(Number(A.value)===q.a){
score++;M.textContent='✅ 答對！';no++;
setTimeout(newQ,500);
}else{
life--;M.textContent='❌ 答錯，再試一次！';
update();
if(life<=0){
document.body.innerHTML='<h1 style="text-align:center;margin-top:80px">💔 遊戲結束<br>得分：'+score+'/20</h1>';
return;
}
A.focus();
}
}
A.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
newQ();
</script>
</body>
</html>
