<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分數小數轉換練習</title>
<style>
body{font-family:Arial;background:#fff7fb;padding:30px}
.box{background:#fff;max-width:600px;margin:auto;padding:20px;border-radius:10px;text-align:center}
input{font-size:22px;padding:8px}
button{font-size:20px;padding:8px 16px;margin-top:10px}
pre{text-align:left;display:inline-block;font-size:22px}
#msg{font-size:26px;font-weight:bold}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;width:24px}.line{width:24px;border-top:2px solid #000;margin:2px 0}.studyList{text-align:left;display:inline-block;font-size:22px}.studyList div{margin:4px 0}
/* ===== Pop! Learning 統一粉紅主題 ===== */
:root{
 --pink:#d95791;
 --pink-dark:#b94d70;
 --pink-mid:#ee8fb3;
 --pink-light:#fff0f6;
 --pink-bg:#fff7fb;
 --pink-border:#f2cddd;
 --pink-shadow:rgba(217,87,145,.13);
 --text:#5f4d57;
}
html,body{
 background:linear-gradient(135deg,#fff7fb 0%,#ffeaf4 100%) !important;
 color:var(--text) !important;
}
body{
 font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif !important;
}
h1,h2,h3{
 color:var(--pink) !important;
}
button{
 background:var(--pink) !important;
 color:#fff !important;
 border:0 !important;
 border-radius:999px !important;
 box-shadow:0 3px 9px var(--pink-shadow);
 font-weight:700;
}
button:hover{background:var(--pink-dark) !important;}
input,textarea,select{
 border-color:var(--pink-border) !important;
 border-radius:12px !important;
}
input:focus,textarea:focus,select:focus{
 outline:none !important;
 border-color:var(--pink) !important;
 box-shadow:0 0 0 3px #ffe2ee !important;
}
.card,.box,.container,.panel,.quiz-box,.detail,.question,.work-area,.memory-card{
 border-color:var(--pink-border) !important;
 box-shadow:0 6px 22px var(--pink-shadow) !important;
}
.question,.guide,.rule,.memory-rule,.stats,.answer,.answer:focus,.explain{
 background:#fff0f6 !important;
}
.primary,.action,.pink{background:var(--pink) !important;color:#fff !important;}
.secondary,.tab:not(.active){background:#f8dce8 !important;color:var(--pink-dark) !important;}
.tab.active,.nav button.active{background:var(--pink) !important;color:#fff !important;}
.topbar,.topMenu{background:#fff0f6 !important;border-color:#f2b0cb !important;}
.topMenu a{border-color:#f2b0cb !important;color:var(--pink-dark) !important;}
.topMenu a:hover{background:var(--pink) !important;color:#fff !important;}
.correct,.ok{color:#2a9a61 !important;}
.wrong{color:#d45563 !important;}

</style>
</head>
<body>
<div class="box">
<h1>分數 ⇄ 小數</h1>

<div id="study">
<h2>先背誦</h2>
<div class="studyList">
<div><span class="frac"><span>1</span><span class="line"></span><span>2</span></span> = 0.5</div><div><span class="frac"><span>1</span><span class="line"></span><span>4</span></span> = 0.25</div><div><span class="frac"><span>3</span><span class="line"></span><span>4</span></span> = 0.75</div><div><span class="frac"><span>1</span><span class="line"></span><span>5</span></span> = 0.2</div><div><span class="frac"><span>2</span><span class="line"></span><span>5</span></span> = 0.4</div><div><span class="frac"><span>3</span><span class="line"></span><span>5</span></span> = 0.6</div><div><span class="frac"><span>4</span><span class="line"></span><span>5</span></span> = 0.8</div><div><span class="frac"><span>1</span><span class="line"></span><span>8</span></span> = 0.125</div><div><span class="frac"><span>3</span><span class="line"></span><span>8</span></span> = 0.375</div><div><span class="frac"><span>5</span><span class="line"></span><span>8</span></span> = 0.625</div><div><span class="frac"><span>7</span><span class="line"></span><span>8</span></span> = 0.875</div></div>
<button onclick="startGame()">開始測驗</button>
</div>

<div id="game" style="display:none">
<h2 id="question"></h2>
<input id="answer" autocomplete="off">
<button onclick="check()">送出</button>
<p id="msg"></p>
<p id="count"></p>
</div>
</div>
<script>
const data=[
{q:'1/2',a:'0.5'},
{q:'1/4',a:'0.25'},
{q:'3/4',a:'0.75'},
{q:'1/5',a:'0.2'},
{q:'2/5',a:'0.4'},
{q:'3/5',a:'0.6'},
{q:'4/5',a:'0.8'},
{q:'1/8',a:'0.125'},
{q:'3/8',a:'0.375'},
{q:'5/8',a:'0.625'},
{q:'7/8',a:'0.875'}
];
let order=[],index=0;

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function startGame(){
document.getElementById('study').style.display='none';
document.getElementById('game').style.display='block';
order=[...data];
shuffle(order);
index=0;
show();
}

function show(){
document.getElementById('question').innerText=order[index].q+' = ?';
document.getElementById('answer').value='';
document.getElementById('answer').focus();
document.getElementById('msg').innerText='';
document.getElementById('count').innerText='第 '+(index+1)+' / '+order.length+' 題';
}

function check(){
let ans=document.getElementById('answer').value.trim();
if(ans===order[index].a){
document.getElementById('msg').innerText='✅ 答對！';
index++;
if(index>=order.length){
setTimeout(()=>{
document.getElementById('game').innerHTML='<h2>🎉 全部完成！</h2>';
},600);
}else{
setTimeout(show,600);
}
}else{
document.getElementById('msg').innerText='❌ 答錯，再試一次！';
document.getElementById('answer').focus();
}
}
document.addEventListener('keydown',e=>{
if(e.key==='Enter' && document.getElementById('game').style.display!=='none')check();
});

function frac(s){
 const p=s.split('/');
 if(p.length!=2) return s;
 return `<span class="frac"><span>${p[0]}</span><span class="line"></span><span>${p[1]}</span></span>`;
}
show=function(){
 document.getElementById('question').innerHTML=frac(order[index].q)+' = ?';
 document.getElementById('answer').value='';
 document.getElementById('answer').focus();
 document.getElementById('msg').innerText='';
 document.getElementById('count').innerText='第 '+(index+1)+' / '+order.length+' 題';
}
</script>
</body>
</html>
