<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>數學測驗 + 貓貓系統</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#fff7fb;
}

.card{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
    padding:10px 15px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}

#question{
    font-size:28px;
    margin:20px;
    font-weight:bold;
}

.factor-boxes{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
}

.factorInput{
    width:55px;
    height:45px;
    font-size:20px;
    text-align:center;
}

#result{
    font-size:24px;
    margin-top:10px;
}

.correct{ color:green; }
.wrong{ color:red; }

/* 工具 */
#factorTools{
    display:none;
    margin-top:10px;
}

#summary{
    width:80%;
    height:45px;
    font-size:20px;
    text-align:center;
}

/* 貓數量 */
#catBox{
    position:fixed;
    right:20px;
    bottom:20px;
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

#catCount{
    font-size:32px;
    color:#ff4d88;
    font-weight:bold;
}

/* 獎勵 */
#reward{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

#rewardBox{
    background:white;
    padding:20px;
    border-radius:15px;
}

/* ===== Pop! Learning 統一粉紅主題 ===== */
:root{
 --pink:#d95791;
 --pink-dark:#b94d70;
 --pink-mid:#ee8fb3;
 --pink-light:#fff0f6;
 --pink-bg:#fff7fb;
 --pink-border:#f2cddd;
 --pink-shadow:rgba(217,87,145,.13);
 --text:#5f4d57;
}
html,body{
 background:linear-gradient(135deg,#fff7fb 0%,#ffeaf4 100%) !important;
 color:var(--text) !important;
}
body{
 font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif !important;
}
h1,h2,h3{
 color:var(--pink) !important;
}
button{
 background:var(--pink) !important;
 color:#fff !important;
 border:0 !important;
 border-radius:999px !important;
 box-shadow:0 3px 9px var(--pink-shadow);
 font-weight:700;
}
button:hover{background:var(--pink-dark) !important;}
input,textarea,select{
 border-color:var(--pink-border) !important;
 border-radius:12px !important;
}
input:focus,textarea:focus,select:focus{
 outline:none !important;
 border-color:var(--pink) !important;
 box-shadow:0 0 0 3px #ffe2ee !important;
}
.card,.box,.container,.panel,.quiz-box,.detail,.question,.work-area,.memory-card{
 border-color:var(--pink-border) !important;
 box-shadow:0 6px 22px var(--pink-shadow) !important;
}
.question,.guide,.rule,.memory-rule,.stats,.answer,.answer:focus,.explain{
 background:#fff0f6 !important;
}
.primary,.action,.pink{background:var(--pink) !important;color:#fff !important;}
.secondary,.tab:not(.active){background:#f8dce8 !important;color:var(--pink-dark) !important;}
.tab.active,.nav button.active{background:var(--pink) !important;color:#fff !important;}
.topbar,.topMenu{background:#fff0f6 !important;border-color:#f2b0cb !important;}
.topMenu a{border-color:#f2b0cb !important;color:var(--pink-dark) !important;}
.topMenu a:hover{background:var(--pink) !important;color:#fff !important;}
.correct,.ok{color:#2a9a61 !important;}
.wrong{color:#d45563 !important;}

</style>
</head>

<body>

<div class="card">

<h1>📚 數學測驗 + 貓貓 🐱</h1>

<div>
<button onclick="startQuiz('factor')">因數測驗</button>
<button onclick="startQuiz('2')">2倍數</button>
<button onclick="startQuiz('3')">3倍數</button>
<button onclick="startQuiz('4')">4倍數</button>
<button onclick="startQuiz('5')">5倍數</button>
<button onclick="startQuiz('6')">6倍數</button>
<button onclick="startQuiz('11')">11倍數</button>
<button onclick="startQuiz('mixed')">混合</button>
</div>

<div id="question"></div>

<div id="factorArea"></div>

<div id="factorTools">
    <button onclick="fillSummary()">⬆ 一鍵整理</button>
    <button onclick="splitBoxes()">⬇ 拆回格子</button>
    <br><br>
    <input id="summary" placeholder="彙總答案">
</div>

<div id="result"></div>

<div style="margin-top:20px;">
    <button id="checkBtn" onclick="check()">✅ 對答案</button>

    <button onclick="showAnswer()">💡 看答案</button>

    <button onclick="next()">➡️ 下一題</button>
</div>

</div>

<!-- 貓獎勵 -->
<div id="reward">
    <div id="rewardBox">
        <h2>🎉 送你一隻貓貓！</h2>
        <img src="../貓.jpg" width="250">
        <br><br>
        <button onclick="closeReward()">收下</button>
    </div>
</div>

<!-- 貓數量 -->
<div id="catBox">
    🐱 貓貓數量<br>
    <div id="catCount">0</div>
</div>

<script>

const factorNumbers=[12,16,18,20,24,30,36,42,48,54,60,72];

let questions=[];
let current;
let mode="";

let cats=0;
let streak=0;

/* ⭐ 改成 5 題 */
const REWARD_STREAK=1;

document.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") check();
});

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

/* 開始 */
function startQuiz(m){

    mode=m;
    streak=0;

    document.getElementById("reward").style.display="none";

    if(mode==="factor"){
        document.getElementById("factorTools").style.display="block";
    }else{
        document.getElementById("factorTools").style.display="none";
    }

    questions = (mode==="factor")
        ? shuffle(factorNumbers)
        : Array.from({length:20},()=>Math.floor(Math.random()*100)+1);

    next();
}

/* 下一題 */
function next(){
    
document.getElementById("result").innerHTML="";
// 清空上一題答案
document.getElementById("summary").value = "";
    if(questions.length===0){
        document.getElementById("question").innerHTML="🎉 全部完成！";
        document.getElementById("factorArea").innerHTML="";
        return;
    }

    let n=questions.shift();

    let text="";

    if(mode==="factor"){

        let factors=[];
        for(let i=1;i<=n;i++){
            if(n%i===0) factors.push(i);
        }

        current={n,factors};

        text=`${n} 的因數有哪些？`;

        let html=`<div class="factor-boxes">`;

        for(let i=0;i<factors.length;i++){
            html+=`<input class="factorInput" type="number">`;
        }

        html+=`</div>`;

        document.getElementById("factorArea").innerHTML=html;

    }else{

        let div=mode;

        if(mode==="mixed"){
            div=["2","3","4","5","6","11"][Math.floor(Math.random()*6)];
        }

        current={n,div:Number(div)};

        /* ⭐ 正確問句 */
        text=`${n} 是 ${div} 的倍數嗎？`;

        document.getElementById("factorArea").innerHTML=
        `<button onclick="judge(true)">是</button>
         <button onclick="judge(false)">不是</button>`;
    }

    document.getElementById("question").innerText=text;
}

/* 因數檢查 */
function check(){

    if(mode!=="factor") return;

    let inputs=document.querySelectorAll(".factorInput");

    let user=[];

    inputs.forEach(i=>{
        let v=Number(i.value);
        if(!isNaN(v)&&i.value!=="") user.push(v);
    });

    user=[...new Set(user)].sort((a,b)=>a-b);
    let ans=[...current.factors].sort((a,b)=>a-b);

if(JSON.stringify(user)===JSON.stringify(ans)){

streak++;

// 因數測驗才送貓
rewardCheck();

document.getElementById("result").innerHTML =
"<span class='correct'>✔ 答對！</span>";

setTimeout(next,500);   // 0.5 秒後自動下一題
}else{

    streak=0;

    document.getElementById("result").innerHTML =
    "<span class='wrong'>✘ 答錯！</span>";

}
}

/* 倍數 */
function judge(user){

    let real = current.div===0 ? false : (current.n % current.div === 0);

if(user===real){

// 倍數測驗不送貓
streak++;

document.getElementById("result").innerHTML =
"<span class='correct'>✔ 答對！</span>";

setTimeout(next,500);  // 0.5 秒後自動下一題
}else{

    streak=0;

    document.getElementById("result").innerHTML =
    "<span class='wrong'>✘ 答錯！</span>";

}
}

/* ⭐ 貓獎勵（5連勝） */
function rewardCheck(){

    if(streak>=REWARD_STREAK){

        streak=0;
        cats++;

        document.getElementById("catCount").innerText=cats;
        document.getElementById("reward").style.display="flex";
    }
}
function showAnswer(){

    if(mode==="factor"){

        let inputs=document.querySelectorAll(".factorInput");
        let user=[];

        inputs.forEach(i=>{
            let v=Number(i.value);
            if(!isNaN(v) && i.value!=="") user.push(v);
        });

        user=[...new Set(user)].sort((a,b)=>a-b);

        let ans=[...current.factors].sort((a,b)=>a-b);

        if(JSON.stringify(user)===JSON.stringify(ans)){

            document.getElementById("result").innerHTML=
            "<span class='correct'>✔ 已經答對，不需要看答案！</span>";

        }else{

            document.getElementById("result").innerHTML=
            "<span class='wrong'>✘ 答錯！<br>正確答案："+ans.join(", ")+"</span>";

        }

    }else{

        let real=current.n % current.div===0;

        document.getElementById("result").innerHTML=
        "<span class='correct'>答案："+(real?"是":"不是")+"</span>";

    }

}
function closeReward(){
    document.getElementById("reward").style.display="none";
}

/* 一鍵整理 */
function fillSummary(){

    let inputs=document.querySelectorAll(".factorInput");

    let arr=[];

    inputs.forEach(i=>{
        let v=Number(i.value);
        if(!isNaN(v)&&i.value!=="") arr.push(v);
    });

    arr=[...new Set(arr)].sort((a,b)=>a-b);

    document.getElementById("summary").value=arr.join(",");
}

/* 拆回 */
function splitBoxes(){

    let arr=document.getElementById("summary").value
        .split(/[,， ]+/)
        .map(Number)
        .filter(x=>!isNaN(x));

    let inputs=document.querySelectorAll(".factorInput");

    inputs.forEach((i,idx)=>{
        i.value=arr[idx]||"";
    });
}

</script>

</body>
</html>
