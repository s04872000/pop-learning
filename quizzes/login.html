<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學生登入｜Pop! Learning</title>
<style>
:root{--pink:#d95791;--dark:#b94d70;--light:#fff0f6;--bg:#fff8fc;--border:#f2cddd;--text:#614f59}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fc,#fff0f6);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:min(430px,100%);background:#fff;border:2px solid var(--border);border-radius:28px;padding:34px 30px;box-shadow:0 15px 35px rgba(217,87,145,.15);text-align:center}
.logo{font-size:42px;margin-bottom:4px}.small{color:#a17f8e;font-size:13px;letter-spacing:.08em}.title{color:var(--dark);font-size:28px;margin:8px 0 24px;font-weight:900}
label{display:block;text-align:left;font-weight:800;color:var(--dark);margin:14px 0 7px}
input{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:14px;outline:none;font-size:16px;background:#fffafd}
input:focus{border-color:#e58caf;box-shadow:0 0 0 4px #fff0f6}
button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:20px;background:var(--pink);color:white;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 6px 14px rgba(217,87,145,.22)}
button:hover{transform:translateY(-1px)}
.note{margin-top:18px;padding:12px;border-radius:13px;background:var(--light);font-size:12px;color:#8d6f7d;line-height:1.7}
.msg{min-height:22px;margin-top:12px;color:#c04d73;font-weight:800;font-size:13px}
.back{display:inline-block;margin-top:18px;color:var(--pink);text-decoration:none;font-size:13px;font-weight:800}
</style>
</head>
<body>
<div class="wrap"><main class="box">
  <div class="logo">🌸</div>
  <div class="small">POP! LEARNING</div>
  <div class="title">👤 學生登入</div>
  <form id="loginForm">
    <label for="account">學生帳號</label>
    <input id="account" autocomplete="username" placeholder="請輸入帳號" required>
    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
    <button type="submit">登入學習專區 →</button>
    <div class="msg" id="msg"></div>
  </form>
  <a class="back" href="../index.html">← 回到首頁</a>
</main></div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const account=document.getElementById("account").value.trim();
  const password=document.getElementById("password").value;
  if(account && password){
    localStorage.setItem("popLearningStudent", account);
    location.href="student.html";
  }else{
    document.getElementById("msg").textContent="請輸入帳號與密碼";
  }
});
</script>
</body>
</html>
