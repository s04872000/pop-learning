
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文複習小考</title>
<style>
body{

font-family:Arial,sans-serif;

max-width:950px;

margin:30px auto;

background:#f5f5f5;

padding:25px;

font-size:24px;

line-height:1.8;

}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
input,
select,
button{

    font-size:24px;

    padding:12px 18px;

    margin:6px;

}
input{width:100%;box-sizing:border-box}
#result{font-weight:bold;height:28px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>英文複習小考</h2>
<select id="grade" onchange="start()">
<option value="g5">小五</option>
<option value="g7">國一</option>
</select>
<p id="progress"></p>
<p><b>中文：</b><span id="chinese"></span></p>
<p><b>English：</b><span id="english"></span></p>
<input id="answer"
       onkeydown="if(event.key==='Enter')check()"
       autocomplete="off">

<br><br>

<button id="checkBtn" onclick="check()">
✔ 確認答案
</button>

<button id="showBtn"
        onclick="showAnswer()"
        style="display:none">
📖 看解答
</button>

<button id="prevBtn"
        onclick="prevQuestion()">
⬅ 上一題
</button>

<button id="nextBtn"
        onclick="nextQuestion()">
下一題 ➜
</button>

<button id="restartBtn"
        onclick="start()"
        style="display:none">
重新開始
</button>

<p id="result"></p>

<p id="answerBox"
   style="display:none;
          color:blue;
          font-weight:bold;">
</p>

<p>
分數：
<span id="score">0</span> /
<span id="total"></span>
</p>
</div>
<script>
const g5=[
{c:"暑假時，我的父母去香港旅行。",e:"My ______ took a trip to Hong Kong this ______.",a:"parents summer",
exp:`
<b>發音：</b>
<br>Hong Kong[ˌhɒŋ ˈkɒŋ]
`
}, 
{c:"香港是一座大城市。",e:"Hong Kong is a big ______.",a:"city",
exp:`
<b>發音：</b>
<br>Hong Kong[ˌhɒŋ ˈkɒŋ]
`
}, 
{c:"香港有很多高樓。",e:"There are many tall ______.",a:"buildings",
exp:`
<b>發音：</b>
<br>building[ˈbɪldɪŋ]
<br>Hong Kong[ˌhɒŋ ˈkɒŋ]
`
}, 
{c:"街上有很多人。",e:"There are lots of ______.",a:"people"},
{c:"街道很擁擠。",e:"The streets are ______.",a:"crowded"},
{c:"香港有中式和西式餐廳。",e:"There are ______ and ______ restaurants.",a:"Chinese Western",
exp:`
<b>發音：</b>
<br>Hong Kong[ˌhɒŋ ˈkɒŋ]
`
}, 
{c:"我們兩個都住在飯店。",e:"We ______ stayed at the ______.",a:"both hotel"},
{c:"我們練習英文。",e:"We ______ English.",a:"practiced",
exp:`
<b>發音：</b>
<br>practiced/ˈpræk.tɪst/
`
}, 
{c:"我很羨慕他。",e:"I ______ him.",a:"envy",
exp:`
<b>發音：</b>
<br>him[hɪm]
`
}, 
{c:"他們去香港旅行。",e:"They ______ to Hong Kong.",a:"took a trip",
exp:`
<b>發音：</b>
<br>Hong Kong[ˌhɒŋ ˈkɒŋ]
`
}, 
{c:"那是一棟高樓。",e:"It is a tall ______.",a:"building",
exp:`
<b>發音：</b>
<br>building[ˈbɪldɪŋ]
`
}, 
{c:"夏天很多人旅行。",e:"Many people travel in ______.",a:"summer",
exp:`
<b>發音：</b>
<br>travel[/ˈtrævəl/]
`
}, 
];

const g7=[
{c:"我的爸爸是一位司機。",e:"My father is a ______.",a:"driver"},
{c:"我的媽媽是一位護士。",e:"My mother is a ______.",a:"nurse"},
{
c:"她是一位漂亮的女服務生。",
e:"She is a beautiful ______.",
a:"waitress",

exp:`
<b>發音提醒：</b><br>
beautiful 的 <b>t</b> 在美式英文常聽起來像 <b>d</b>，但拼字仍然是 <b>t</b>。
`
},
{c:"那位英俊的男服務生很受歡迎。",e:"The handsome ______ is ______.",a:"waiter popular",
exp:`
<b>發音提醒：</b><br>
waiter 的 t 在美式英文中常會發成接近 d 的音，但拼字都仍然是 t。
`
},

{c:"他是一位店員。",e:"He is a ______.",a:"clerk"},
{c:"那位推銷員很年輕。",e:"The ______ is ______.",a:"salesman young"},
{c:"那位商人是我的老闆。",e:"The ______ is my ______.",a:"businessman boss",
exp:`
<b>發音：</b>
<br>boss[bɒs]
`
}, 
{c:"店主是一位認真的工作者。",e:"The ______ is a hard-working ______.",a:"shopkeeper worker"
,
exp:`
<b>單字拆解：</b><br>
shop（商店）＋keeper（管理者）＝shopkeeper（店主）
`

},
{c:"她是一位作家。",e:"She is a ______.",a:"writer",
exp:`
<b>發音提醒：</b><br>
writer 的 t 在美式英文中常聽起來像 d，但拼字仍然是 t。
`
},
{c:"我的第一份工作。",e:"My ______ ______.",a:"first job"},
{c:"我親愛的父母。",e:"My ______ ______.",a:"dear parents"},
{c:"我的家人和同學都很年輕。",e:"My ______ and ______ are young.",a:"family classmate"},
{c:"那位警察有一個女兒。",e:"The ______ ______ has a ______.",a:"police officer daughter",
exp:`
<b>發音：</b>
<br>police [pəˈliːs]<br>
officer [ˈɒfɪsə(r)]
`
}, 

{
c:"這是一本新的故事書。",
e:"This is a ______ book of ______.",
a:"new stories",

exp:`
<b>文法重點</b><br>
① new 是形容詞，放在名詞前面。<br>
② book 是名詞。<br>
③ of stories = 裡面有很多故事。<br>
book of stories = 一本故事書。<br><br>

`
},   // ← 這裡一定要加逗號

{
c:"她很漂亮。",
e:"She is ______.",
a:"beautiful",

exp:`
<b>發音提醒：</b><br>
beautiful 的 <b>t</b> 在美式英文常聽起來像 <b>d</b>，但拼字仍然是 <b>t</b>。
`
},
];
let qs=[],i=0,s=0;

let answered=[];

let finished=[];
function sh(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}}
function norm(x){return x.trim().replace(/\s+/g," ")}
function start(){
qs=[...(grade.value==="g5"?g5:g7)];

answered=[];

answerBox.style.display="none";sh(qs);i=0;s=0;

score.textContent=0;total.textContent=qs.length;
answer.style.display="";
checkBtn.style.display="";
showBtn.style.display="none";
prevBtn.style.display="";
nextBtn.style.display="";
restartBtn.style.display="none";
show();
}
function show(){

    progress.textContent=`第 ${i+1}/${qs.length} 題`;

    chinese.textContent=qs[i].c;

    english.textContent=qs[i].e;

    answer.value="";

    answer.focus();

    result.textContent="";

    answerBox.style.display="none";

    showBtn.style.display="none";

    prevBtn.disabled=(i==0);

    nextBtn.disabled=(i==qs.length-1);

}
function showAnswer(){

    answerBox.style.display="block";

    answerBox.innerHTML =
        "<b>答案：</b><br>" + qs[i].a +
        "<hr>" +
        (qs[i].exp || "");

}

function nextQuestion(){

if(i<qs.length-1){

i++;

show();

}else{

progress.textContent="";

chinese.textContent="🎉 全部完成！";

english.textContent="成績："+s+"/"+qs.length;

answer.style.display="none";

checkBtn.style.display="none";

showBtn.style.display="none";

prevBtn.style.display="none";

nextBtn.style.display="none";

restartBtn.style.display="";

result.textContent="";

answerBox.style.display="none";

}

}

function prevQuestion(){

if(i>0){

i--;

show();

}

}

function check(){

    let u = norm(answer.value);

    let a = norm(qs[i].a);

    if(u===a){

        if(!answered[i]){
            answered[i]=true;
            s++;
            score.textContent=s;
        }

        result.innerHTML="<span style='color:green;font-weight:bold;'>✅ 答對了！</span>";

        showBtn.style.display="none";

        return;

    }

    if(u.toLowerCase()===a.toLowerCase()){

        result.innerHTML="<span style='color:orange;font-weight:bold;'>⚠️ 大小寫錯誤</span>";

        showBtn.style.display="inline";

        answer.select();

        return;

    }

    result.innerHTML="<span style='color:red;font-weight:bold;'>❌ 拼字錯誤，再試一次</span>";

    showBtn.style.display="inline";

    answer.select();

}
start();
</script>
</body>
</html>
