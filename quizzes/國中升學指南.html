<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>國中升學指南｜Pop! Learning</title><style>
:root{--pink:#d95791;--pink-dark:#b94d70;--pink-light:#fff0f6;--pink-bg:#fff7fb;--border:#f2cddd;--text:#5f4d57;--muted:#8b7180;--shadow:rgba(217,87,145,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:linear-gradient(135deg,#fff7fb,#ffeaf4);color:var(--text)}
.nav{position:sticky;top:0;z-index:10;background:rgba(255,240,246,.94);backdrop-filter:blur(8px);border-bottom:1px solid #f2cddd;padding:12px 16px;text-align:center}.nav a{display:inline-block;margin:4px 5px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid #f2cddd;color:var(--pink-dark);text-decoration:none;font-weight:800;font-size:14px}.nav a:hover{background:var(--pink);color:#fff}
.wrap{max-width:1100px;margin:auto;padding:34px 18px 70px}.hero{text-align:center;margin-bottom:28px}.hero h1{margin:0;color:var(--pink);font-size:32px;font-weight:900}.hero p{color:var(--muted);margin:10px auto 0;max-width:720px;line-height:1.8}.back{display:inline-block;margin-top:16px;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--pink-dark);text-decoration:none;font-weight:800}
.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 14px;color:var(--pink-dark);font-size:23px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border:2px solid var(--border);border-radius:22px;padding:14px;box-shadow:0 7px 20px var(--shadow);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 11px 25px rgba(217,87,145,.17)}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:15px;background:#fff0f6;border:1px solid #f4d5e2;cursor:pointer}.card h3{margin:11px 4px 4px;color:var(--pink);font-size:18px}.card p{margin:0 4px;color:var(--muted);font-size:13px;line-height:1.55}.tag{display:inline-block;margin:10px 4px 0;padding:4px 9px;border-radius:999px;background:#fff0f6;color:var(--pink-dark);font-size:11px;font-weight:800}.guide-card{padding:16px}.guide-img{width:100%;border-radius:16px;border:1px solid var(--border);background:#fff}.note{margin:18px auto;padding:13px 16px;border-radius:16px;background:#fff0f6;border:1px solid var(--border);color:#806977;line-height:1.7;max-width:900px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:rgba(70,40,55,.72);z-index:99;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal img{max-width:94vw;max-height:88vh;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.3);background:#fff}.modal button{position:absolute;top:18px;right:22px;border:0;border-radius:50%;width:44px;height:44px;background:#fff;color:var(--pink);font-size:26px;cursor:pointer}.footer{text-align:center;color:#9a7b89;padding:10px 0 0;font-size:13px}
@media(max-width:600px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr}.nav a{font-size:13px;padding:7px 11px}}
</style></head><body>
